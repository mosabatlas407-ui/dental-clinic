<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول الإدارة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma;
            background: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h2 { color: #0077b6; margin-bottom: 20px; }
        .input-group {
            position: relative;
            width: 100%;
            margin: 15px 0;
        }
        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Segoe UI', Tahoma;
            display: block;
        }
        .input-group .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #0077b6;
            padding: 0;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #0077b6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .error { color: red; margin-bottom: 10px; }
        a {
            display: block;
            margin-top: 15px;
            color: #0077b6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 دخول الإدارة</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder="كلمة المرور" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
            </div>
            <button type="submit">دخول</button>
        </form>
        <a href="/">العودة للرئيسية</a>
    </div>
    <script>
        function togglePassword() {
            var pwd = document.getElementById('password');
            var icon = event.target;
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = '🙈';
            } else {
                pwd.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
