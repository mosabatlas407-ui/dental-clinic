<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}لوحة الإدارة - {{ clinic.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-mint-light: #f0fdf4;
      --bg-mint-soft: #e6fffa;
      --teal-primary: #14b8a6;
      --teal-dark: #0d9488;
      --teal-light: #ccfbf1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-large: 24px;
      --radius-pill: 9999px;
      --shadow-soft: 0 12px 32px -8px rgba(20, 184, 166, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--bg-mint-light) 0%, var(--bg-white) 50%);
      color: var(--text-dark);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .admin-header {
      background: var(--bg-white);
      border-bottom: 2px solid var(--teal-light);
      padding: 18px 0;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 4px 16px rgba(20, 184, 166, 0.05);
    }
    .admin-header .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 900; color: var(--teal-primary); text-decoration: none; }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--teal-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--teal-primary);
    }
    .brand-suffix { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }
    .logout {
      background: #ffffff; color: #e63946;
      border: 2px solid #fecaca; border-radius: var(--radius-pill);
      padding: 10px 22px; font-weight: 800; font-size: 0.95rem;
      text-decoration: none; font-family: 'Cairo', sans-serif;
      transition: all 0.2s;
    }
    .logout:hover { background: #fef2f2; }

    /* Tabs */
    .tabs { background: var(--bg-white); border-bottom: 1px solid var(--border-color); padding: 14px 0; }
    .tabs .inner { display: flex; gap: 10px; flex-wrap: wrap; }
    .tabs a {
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-weight: 800; font-size: 0.95rem;
      text-decoration: none; color: var(--text-muted);
      background: var(--bg-mint-light);
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .tabs a:hover { color: var(--teal-dark); background: var(--teal-light); }
    .tabs a.active { background: var(--teal-primary); color: #ffffff; box-shadow: 0 6px 14px rgba(20, 184, 166, 0.3); }

    /* Main */
    .admin-main { padding: 36px 24px 80px; }
    .page-title { font-size: 1.9rem; text-align: center; color: var(--teal-dark); margin-bottom: 10px; }
    .page-sub { text-align: center; color: var(--text-muted); font-weight: 600; margin-bottom: 32px; }

    /* Cards */
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-soft);
      border: 2px solid var(--bg-mint-light);
      padding: 28px;
      margin: 0 auto 28px;
      width: 100%;
    }
    .card-narrow { max-width: 560px; }
    .card h3 { color: var(--teal-dark); margin-bottom: 18px; font-size: 1.25rem; }

    /* Forms */
    label { display: block; margin: 14px 0 6px; font-weight: 700; font-size: 0.95rem; }
    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      color: var(--text-dark);
      background: var(--bg-white);
      transition: border 0.3s, box-shadow 0.3s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--teal-primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
    }
    textarea { resize: vertical; min-height: 70px; }
    input.ltr { direction: ltr; text-align: left; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 13px;
      border: none; border-radius: var(--radius-pill);
      font-family: 'Cairo', sans-serif;
      font-size: 1rem; font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
      background: var(--teal-primary); color: #ffffff;
      box-shadow: 0 8px 20px rgba(20, 184, 166, 0.25);
    }
    .btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
    .btn-green { background: #2a9d8f; }
    .btn-green:hover { background: #25847a; }
    .btn-red { background: #e76f51; box-shadow: 0 8px 20px rgba(231, 111, 81, 0.25); }
    .btn-red:hover { background: #d85f41; }
    .btn-blue { background: #3a86ff; box-shadow: 0 8px 20px rgba(58, 134, 255, 0.25); }
    .btn-blue:hover { background: #2a70dd; }
    .btn-amber { background: #f4a261; color: #3b2f1f; box-shadow: 0 8px 20px rgba(244, 162, 97, 0.3); }
    .btn-amber:hover { background: #e8924b; }

    .msg {
      text-align: center; padding: 14px 20px;
      border-radius: 14px; margin: 0 auto 24px; font-weight: 800;
      background: var(--teal-light); color: var(--teal-dark);
      max-width: 760px;
    }
    .hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; line-height: 1.8; }
    .status { text-align: center; font-weight: 800; margin-bottom: 10px; padding: 8px; border-radius: 12px; }
    .status.ok { color: #2a9d8f; background: #e6fffa; }
    .status.no { color: #e63946; background: #fef2f2; }

    /* Tables */
    .table-wrap {
      background: var(--bg-white);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-soft);
      border: 2px solid var(--bg-mint-light);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px; border-bottom: 1px solid var(--border-color); text-align: center; }
    th { background: var(--teal-light); color: var(--teal-dark); font-weight: 800; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-mint-light); }

    /* Badges & actions */
    .actions a, .actions button {
      margin: 3px; color: #fff; padding: 7px 14px;
      border-radius: var(--radius-pill); text-decoration: none;
      font-size: 0.85rem; font-family: 'Cairo', sans-serif;
      font-weight: 800; border: none; cursor: pointer;
      display: inline-block;
    }
    .a-complete { background: #2a9d8f; }
    .a-remind { background: #3a86ff; }
    .a-edit { background: #f4a261; }
    .a-cancel { background: #e63946; }
    .a-view { background: var(--teal-primary); }
    a:hover { text-decoration: none; }
    .badge { padding: 4px 12px; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 800; }
    .badge-paid { background: #e6fffa; color: #2a9d8f; }
    .badge-unpaid { background: #fef2f2; color: #e63946; }
    .email-col { font-size: 0.85rem; color: var(--text-muted); direction: ltr; }

    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--teal-dark); font-weight: 800; text-decoration: none; }
    .back-link:hover { color: var(--teal-primary); }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="container inner">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-2 0-2.5 1.6-4.2 1.6C5.6 4.1 5 7 4.2 9.3c-.9 2.4.6 5.1 2 6.8.9 1.1 1.4 2.6 2.3 2.6.7 0 .8-2.1 1.9-2.6 1.4-.6 1.5 2.3 2.4 2.3.9 0 .9-2.6 1.9-3.4.9-.7 1.3-1.9 1.7-3.2.5-1.8.4-5.3-.6-6.9-1-1.6-1.3-.3-2.1-.3C15 4.1 14 2.5 12 2.5z"/></svg>
        </div>
        <span>{{ clinic.name }}</span>
        <span class="brand-suffix">| لوحة الإدارة</span>
      </a>
      <a href="/admin/logout" class="logout">⏻ تسجيل الخروج</a>
    </div>
  </header>

  <nav class="tabs">
    <div class="container inner">
      <a href="/admin/dashboard" class="{{ 'active' if request.path.startswith('/admin/dashboard') or request.path.startswith('/admin/edit') }}">📅 المواعيد</a>
      <a href="/admin/invoices" class="{{ 'active' if request.path.startswith('/admin/invoices') }}">🧾 الفواتير</a>
      <a href="/admin/prices" class="{{ 'active' if request.path.startswith('/admin/prices') }}">💰 الأسعار</a>
      <a href="/admin/settings" class="{{ 'active' if request.path.startswith('/admin/settings') }}">⚙️ الإعدادات</a>
      <a href="/admin/pdf" class="{{ 'active' if request.path.startswith('/admin/pdf') }}">📄 PDF الأسبوعي</a>
    </div>
  </nav>

  <main class="container admin-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
