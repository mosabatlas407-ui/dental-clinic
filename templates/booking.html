<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - {{ clinic.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-mint-light: #f0fdf4;
      --bg-mint-soft: #e6fffa;
      --teal-primary: #14b8a6;
      --teal-dark: #0d9488;
      --teal-light: #ccfbf1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-large: 28px;
      --radius-pill: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--bg-mint-light) 0%, var(--bg-white) 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-dark);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      font-size: 1.5rem; font-weight: 900; color: var(--teal-primary);
      text-decoration: none; margin-bottom: 28px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--teal-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--teal-primary);
    }
    .card {
      background: var(--bg-white);
      border-radius: var(--radius-large);
      box-shadow: 0 20px 50px -12px rgba(20, 184, 166, 0.18);
      padding: 40px;
      width: 100%;
      max-width: 560px;
      border: 2px solid var(--bg-mint-light);
    }
    .card h2 { font-size: 1.9rem; color: var(--teal-dark); margin-bottom: 8px; text-align: center; }
    .type-badge {
      display: inline-block;
      background: var(--teal-light);
      color: var(--teal-dark);
      padding: 8px 22px;
      border-radius: var(--radius-pill);
      font-weight: 800;
      font-size: 0.95rem;
      margin: 0 auto 24px;
      width: fit-content;
      display: flex;
    }
    .type-note { text-align: center; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; margin-bottom: 20px; }
    label { display: block; text-align: right; margin: 16px 0 6px; font-weight: 700; color: var(--text-dark); font-size: 0.95rem; }
    input, select {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      color: var(--text-dark);
      transition: border 0.3s, box-shadow 0.3s;
      background: var(--bg-white);
    }
    input:focus, select:focus {
      border-color: var(--teal-primary);
      outline: none;
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
    }
    .select-field {
      position: relative;
      border-radius: 14px;
      transition: transform 0.22s ease;
    }
    .select-field::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-left: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: translateY(-70%) rotate(-45deg);
      pointer-events: none;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }
    .select-field:hover,
    .select-field:focus-within { transform: translateY(-2px); }
    .select-field:hover::after,
    .select-field:focus-within::after {
      border-color: var(--teal-dark);
      transform: translateY(-35%) rotate(-45deg);
    }
    .select-control {
      appearance: none;
      min-height: 54px;
      padding-inline: 50px 48px;
      cursor: pointer;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
    }
    .select-field:hover .select-control {
      border-color: #99e6dc;
      background-color: #fbfffe;
    }
    .select-control:focus-visible {
      border-color: var(--teal-primary);
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.14);
    }
    .select-tooth {
      position: absolute;
      right: 16px;
      top: 50%;
      width: 20px;
      height: 20px;
      color: var(--teal-dark);
      pointer-events: none;
      transform: translateY(-50%);
      transition: color 0.22s ease;
    }
    .select-field:focus-within .select-tooth { animation: tooth-nod 0.48s ease; color: var(--teal-primary); }
    @keyframes tooth-nod {
      0%, 100% { transform: translateY(-50%) rotate(0); }
      38% { transform: translateY(-50%) rotate(-10deg) scale(1.08); }
      72% { transform: translateY(-50%) rotate(6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .select-field, .select-field::after, .select-control, .select-tooth { transition: none; }
      .select-field:focus-within .select-tooth { animation: none; }
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      padding: 15px;
      background: var(--teal-primary); color: #fff;
      border: none; border-radius: var(--radius-pill);
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem; font-weight: 800;
      margin-top: 28px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(20, 184, 166, 0.3);
      transition: all 0.25s ease;
    }
    .btn:hover { background: var(--teal-dark); transform: translateY(-2px); box-shadow: 0 14px 28px rgba(20, 184, 166, 0.4); }
    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: var(--bg-white);
      color: var(--teal-dark);
      text-align: center;
      text-decoration: none;
      border-radius: var(--radius-pill);
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      transition: background 0.3s;
      border: 2px solid var(--border-color);
    }
    .home-btn:hover { background: var(--bg-mint-light); border-color: var(--teal-light); }
    @media (max-width: 560px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <a href="/" class="brand">
    <div class="brand-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-2 0-2.5 1.6-4.2 1.6C5.6 4.1 5 7 4.2 9.3c-.9 2.4.6 5.1 2 6.8.9 1.1 1.4 2.6 2.3 2.6.7 0 .8-2.1 1.9-2.6 1.4-.6 1.5 2.3 2.4 2.3.9 0 .9-2.6 1.9-3.4.9-.7 1.3-1.9 1.7-3.2.5-1.8.4-5.3-.6-6.9-1-1.6-1.3-.3-2.1-.3C15 4.1 14 2.5 12 2.5z"/></svg>
    </div>
    {{ clinic.name }}
  </a>
  <div class="card">
    <h2>حجز موعد</h2>
    <div class="type-badge">
      {% if booking_type == 'consultation' %}  استشارة
      {% elif booking_type == 'urgent' %}  حجز مستعجل
      {% else %}  عملية
      {% endif %}
    </div>
    <div class="type-note">سيُحدد لك أقرب موعد متاح تلقائيًا (الأحد - الخميس)</div>
    <form action="/book" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="booking_type" value="{{ booking_type }}">
      <label>الاسم الكامل:</label>
      <input type="text" name="name" required placeholder="اكتب اسمك الثلاثي">
      <label>العمر:</label>
      <input type="number" name="age" min="1" max="120" required placeholder="مثال: 25">
      <label for="gender">الجنس:</label>
      <div class="select-field">
        <svg class="select-tooth" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.5c-2.45 0-3.35 1.55-5.08 1.55C4.67 4.05 3 6.08 3 9.18c0 2.64 1.12 5.56 2.55 8.22.85 1.58 1.85 3.1 2.8 3.1 1.34 0 1.17-4.17 3.65-4.17s2.32 4.17 3.66 4.17c.95 0 1.95-1.52 2.8-3.1C19.9 14.74 21 11.82 21 9.18c0-3.1-1.67-5.13-3.92-5.13C15.35 4.05 14.45 2.5 12 2.5Z"/>
        </svg>
        <select class="select-control" id="gender" name="gender" required>
          <option value="">اختر...</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>
      <label>تشخيص الحالة:</label>
      <input type="text" name="address" required placeholder="اكتب وصفاً مختصراً للحالة (مثال: ألم في الضرس الخلفي)">
      <label>البريد الإلكتروني:</label>
      <input type="email" name="email" required placeholder="لإرسال تأكيد الموعد والتذكيرات">
      <button type="submit" class="btn">احجز الآن</button>
    </form>
    <a href="/" class="home-btn">العودة للرئيسية</a>
  </div>
</body>
</html>
